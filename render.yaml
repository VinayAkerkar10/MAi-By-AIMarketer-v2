      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "43200"
      - key: LOG_LEVEL
        value: INFO
      - key: CONFIG_DIR
        value: /opt/render/project/src/config
      - key: LLM_PROVIDER
        value: ollama_cloud
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_API_KEY
        sync: false
      - key: MODEL_NAME
        value: kimi-k2:1t
      - key: REQUEST_TIMEOUT
        value: "60"
      - key: STRATEGY_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4
      - key: OPENAI_MAX_TOKENS
        value: "2000"

