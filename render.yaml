services:
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SERVICE_COMMAND
        value: uvicorn services.auth_service.main:app --host 0.0.0.0 --port $PORT
      - key: ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "43200"

  - type: web
    name: licensing-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SERVICE_COMMAND
        value: uvicorn services.licensing_service.main:app --host 0.0.0.0 --port $PORT
      - key: ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "43200"

  - type: web
    name: strategy-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SERVICE_COMMAND
        value: uvicorn services.strategy_ai_service.main:app --host 0.0.0.0 --port $PORT
      - key: ENV
