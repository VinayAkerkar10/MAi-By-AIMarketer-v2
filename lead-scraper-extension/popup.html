<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Scraper Extension</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            width: 320px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f7f4ee;
            color: #1f2933;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        p {
            margin: 0 0 12px;
            color: #52606d;
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.primary {
            background: #0f766e;
            color: #fff;
        }

        button.secondary {
            background: #dbeafe;
            color: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            min-height: 44px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #d9e2ec;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .meta {
            margin-top: 10px;
            font-size: 12px;
            color: #52606d;
        }
    </style>
</head>
<body>
    <h1>Lead Scraper</h1>
    <p>Scrape the current page, then send the extracted payload into the MAi app.</p>

    <div class="actions">
        <button id="scrapeBtn" class="primary">Scrape Page</button>
        <button id="sendBtn" class="secondary" disabled>Send to App</button>
    </div>

    <div id="status" class="status">Ready to scrape this page.</div>
    <div id="meta" class="meta"></div>

    <script src="popup.js"></script>
</body>
</html>
